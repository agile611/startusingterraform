site_name: Curso de Terraform
site_description: Documentación y prácticas del curso de Terraform
site_author: Guillem Hernandez Sola
site_url: https://agile611.github.io/startusingterraform/

repo_name: agile611/startusingterraform
repo_url: https://github.com/agile611/startusingterraform

theme:
  name: material
  language: es

  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar al modo oscuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar al modo claro

nav:
  - Inicio: index.md

  - Terraform con Azure:
      - Introducción: azure/index.md
      - "1.1 Infraestructura como código": azure/01-01-introduccion-iac.md
      - "1.2 Terraform frente a otras herramientas": azure/01-02-comparativa-herramientas.md
      - "1.3 Declarativo frente a imperativo": azure/01-03-declarativo-imperativo.md
      - "1.4 Instalación de herramientas y arranque de Topaz": azure/01-04-Instalacion-de-herramientas-y-arranque-de-Topaz.md
      - "1.5 Entorno Práctico: Terraform con Azure Emulator Topaz en Docker": azure/01-05-Entorno-Práctico-Terraform-Azure-Emulator-Topaz-en-Docker.md
      - "1.6 Introducción a Azure y Terraform": azure/01-06-Introduccion-a-Azure-y-Terraform.md
      - "1.7 Configuración Azure Cli": azure/01-07-configuracion-azure-cli.md
      - "1.8 Prueba de humo del entorno": azure/01-08-prueba-de-humo.md
      - "1.9 Desplegar una VM en el Azure Emulator con Terraform": azure/01-09-Desplegar-una-VM-en-el-Azure-Emulator-con-Terraform.md
      - "2.1 Creación de grupos de recursos y recursos con Terraform": azure/02-01-Creacion-de-grupos-de-recursos-y-recursos-con-Terraform.md
      - "2.2 Verificación y validación de recursos en Azure": azure/02-02-Verificacion-y-validacion-de-recursos-en-Azure.md
      - "3.1 Sintaxis del lenguaje HCL en Terraform": azure/03-01-Sintaxis-del-lenguaje-HCL-en-Terraform.md
      - "3.2 Bloques principales de Terraform": azure/03-02-Bloques-principales-de-Terraform.md
      - "3.3 Configuración del provider azurerm": azure/03-03-Configuracion-del-provider-azurerm.md
      - "3.4 Crear tu primer Resource Group con Terraform": azure/03-04-Crear-tu-primer-Resource-Group-con-Terraform.md
      - "4.1 Comandos clave de Terraform": azure/04-01-Comandos-clave-de-Terraform.md
      - "4.2 Almacenamiento y bloqueo del state": azure/04-02-Almacenamiento-y-bloqueo-del-state.md
      - "5.1 Variables en Terraform": azure/05-01-variables-en-terraform.md
      - "5.2 Variables básicas en Terraform": azure/05-02-variables-basicas-en-terraform.md
